<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">CampusPath AI adaptive course workspace concept</title><desc id="desc">Course-grounded adaptive learning and viva interface illustration using warm cream, leaf green, orange and graphite. Not a screenshot.</desc><defs><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#FBF0D9"/><stop offset="1" stop-color="#FFE4CF"/></linearGradient><filter id="ds"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-opacity=".15"/></filter></defs><rect width="1400" height="820" fill="url(#warm)"/><path d="M1060 0L1400 0V250Z" fill="#E99D73" opacity=".19"/><text x="83" y="91" fill="#A5633C" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4">PERSONALIZED LEARNING</text><text x="78" y="161" fill="#243F39" font-family="Arial" font-size="65" font-weight="800">CampusPath <tspan fill="#D97845">AI</tspan></text><text x="81" y="212" fill="#746F61" font-family="Arial" font-size="23">Learn from course material. Practice. Explain. Improve.</text><g filter="url(#ds)"><rect x="75" y="266" width="1250" height="487" rx="25" fill="#FFFEFA"/><rect x="75" y="266" width="1250" height="62" rx="25" fill="#214F41"/><rect x="75" y="313" width="1250" height="15" fill="#214F41"/><text x="110" y="305" fill="#F0F8F2" font-family="Arial" font-size="23" font-weight="700">CampusPath AI</text><text x="1028" y="305" fill="#D1E7D7" font-family="Arial" font-size="17">Student workspace</text><rect x="101" y="351" width="318" height="376" rx="19" fill="#F1F3E8"/><text x="127" y="393" fill="#234A3E" font-family="Arial" font-size="22" font-weight="700">Course navigator</text><rect x="120" y="418" width="278" height="76" rx="12" fill="#DCECE2"/><text x="140" y="448" fill="#265443" font-family="Arial" font-size="18" font-weight="700">Artificial Intelligence</text><text x="140" y="475" fill="#648071" font-family="Arial" font-size="16">Your learning path</text><g font-family="Arial" font-size="19" fill="#505D54"><circle cx="139" cy="526" r="9" fill="#E99357"/><text x="163" y="532">Search algorithms</text><circle cx="139" cy="579" r="9" fill="#7CA990"/><text x="163" y="585">Knowledge representation</text><circle cx="139" cy="632" r="9" fill="#7CA990"/><text x="163" y="638">Assessment practice</text></g><rect x="445" y="351" width="552" height="232" rx="19" fill="#FFFFFF" stroke="#E7E7D9"/><rect x="469" y="374" width="155" height="31" rx="15" fill="#FBE9D9"/><text x="488" y="396" font-family="Arial" font-size="16" fill="#C06A3A">PRACTICE VIVA</text><text x="470" y="446" font-family="Arial" font-size="25" font-weight="700" fill="#2B423B">Explain the difference between</text><text x="470" y="478" font-family="Arial" font-size="25" font-weight="700" fill="#2B423B">BFS and DFS with an example.</text><rect x="469" y="511" width="493" height="49" rx="12" fill="#F3F7F2" stroke="#D7E5D8"/><text x="487" y="542" font-size="19" font-family="Arial" fill="#6D8172">Type your response or start speaking ...</text><rect x="1021" y="351" width="274" height="232" rx="19" fill="#1E4540"/><text x="1045" y="393" font-size="20" font-family="Arial" font-weight="700" fill="#FFF2DD">Source-backed study</text><rect x="1046" y="422" width="222" height="9" rx="5" fill="#91B5A4"/><rect x="1046" y="443" width="194" height="9" rx="5" fill="#91B5A4"/><rect x="1046" y="464" width="213" height="9" rx="5" fill="#91B5A4"/><rect x="1046" y="503" width="180" height="43" rx="13" fill="#F7BE77"/><text x="1062" y="530" font-size="17" font-family="Arial" font-weight="700" fill="#45331A">Open course notes</text><rect x="446" y="604" width="849" height="122" rx="19" fill="#F8F4E9"/><text x="470" y="643" fill="#344B43" font-family="Arial" font-size="21" font-weight="700">A learning workflow, not just a chatbot</text><g fill="#5B7063" font-size="18" font-family="Arial"><text x="471" y="680">Course retrieval</text><text x="694" y="680">Prerequisite guidance</tex